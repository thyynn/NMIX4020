<!DOCTYPE html>
<html lang="">
<head>
<meta charset="utf-8">
<title>J form test</title>

</head>
<body>
<label for="name">Name:</label>
<input type="text" id="name" name="user_name">
<button id="clickme">value</button>
<div id="output"></div>

<script>
var formVal = document.querySelector('#name');
var whichBut = document.querySelector("#clickme");
var outputDiv = document.querySelector("#output");

function getVal() {
  outputDiv.innerHTML = "Hello " + formVal.value;
}

 whichBut.onclick = getVal;
</script>
</body>
