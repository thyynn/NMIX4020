<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Trivia Part 1</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap');

        :root {
            --bg-1: #fdf6e3;
            --bg-2: #ffe6d1;
            --ink: #1f2a44;
            --accent: #ff6b35;
            --accent-dark: #d94d1d;
            --card: #fffef9;
            --line: #f2d4bf;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Space Grotesk", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 20%, rgba(255, 107, 53, 0.22), transparent 40%),
                radial-gradient(circle at 85% 10%, rgba(31, 42, 68, 0.16), transparent 35%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2));
            padding: 20px;
        }

        .trivia-card {
            width: min(680px, 100%);
            background: var(--card);
            border: 2px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 14px 30px rgba(31, 42, 68, 0.12);
            padding: 28px 24px;
        }

        h1 {
            margin: 0 0 14px;
            font-family: "Fraunces", serif;
            letter-spacing: 0.4px;
            font-size: clamp(1.8rem, 5vw, 2.3rem);
        }

        .subtitle {
            margin: 0 0 20px;
            font-size: 0.98rem;
            opacity: 0.84;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        button {
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .primary-btn {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 18px rgba(255, 107, 53, 0.35);
        }

        .primary-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .secondary-btn {
            background: #1f2a44;
            color: #fff;
        }

        .secondary-btn:hover {
            background: #151d31;
            transform: translateY(-1px);
        }

        .block {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1.5px solid var(--line);
            background: #fff;
            min-height: 54px;
            display: flex;
            align-items: center;
            line-height: 1.4;
        }

        #category h2 {
            margin: 0;
            font-size: 1.05rem;
        }
    </style>
</head>
<body>
    <main class="trivia-card">
        <h1>Random Trivia</h1>
        <p class="subtitle">Pull a random question and test your knowledge.</p>
        <div class="row">
            <button class="primary-btn" onclick="qa()">New Question</button>
            <button class="secondary-btn" onclick="showAnswer()">Show Answer</button>
        </div>
        <div class="block" id="category">Category will appear here.</div>
        <div class="block" id="question">Click "New Question" to start.</div>
        <div class="block" id="answer">Answer will appear here.</div>
    </main>
</body>

<script src="randomTrivia.js"></script>
</html>
