<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Routine Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="objectProject.css">
</head>
<body>
    <main class="page-shell">
        <section class="hero-card">
            <p class="eyebrow">Thy's Makeup Routine</p>
            <h1>Beauty Product Shop</h1>
            <p class="intro">Choose a category to browse products from my routine.</p>
            <div class="hero-pills">
                <span>Free shipping over $35</span>
                <span>Clean beauty picks</span>
                <span>New drops weekly</span>
            </div>
        </section>

        <section class="controls-card">
            <h2>Shop By Category</h2>
            <div id="makeup-buttons"></div>
        </section>

        <section class="details-card">
            <h2 id="selected-title">Product Details</h2>
            <p id="aboutme">Click a button to start your beauty walkthrough.</p>
            <div id="image"></div>
        </section>
    </main>

    <script src="objectProject.js"></script>
</body>
</html>
